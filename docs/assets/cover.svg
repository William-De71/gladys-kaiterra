<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Kaiterra integration for Gladys Assistant (illustration,
       not the logo of Kaiterra nor a picture of its devices). A room at dusk
       with a square air quality monitor on a shelf, its ring in the colors
       of the AQI levels, and the values it reads. Built into cover.jpg by
       scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3346"/>
      <stop offset="1" stop-color="#2f5168"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b880"/>
      <stop offset="1" stop-color="#7fa6c4"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#d9e1e8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#wall)"/>

  <!-- a window, a shelf, a plant -->
  <rect x="470" y="40" width="280" height="220" rx="6" fill="url(#window)" opacity="0.85"/>
  <path d="M610 40 V260 M470 150 H750" stroke="#1d3346" stroke-width="10"/>
  <rect x="420" y="410" width="360" height="16" rx="3" fill="#9a7552"/>
  <path d="M722 410 l-10 -48 h44 l-10 48 z" fill="#c9774d"/>
  <g fill="#5f9e62">
    <ellipse cx="722" cy="340" rx="11" ry="30" transform="rotate(-25 722 340)"/>
    <ellipse cx="740" cy="335" rx="11" ry="32" transform="rotate(18 740 335)"/>
    <ellipse cx="731" cy="325" rx="10" ry="34"/>
  </g>

  <!-- the monitor: a white square with a ring of AQI colors -->
  <g transform="translate(560 330)">
    <rect x="-100" y="-120" width="200" height="200" rx="28" fill="url(#device)"/>
    <g fill="none" stroke-width="12" stroke-linecap="round" transform="translate(0 -20)">
      <path d="M-58 30 A66 66 0 0 1 -62 -12" stroke="#2fa34b"/>
      <path d="M-58 -30 A66 66 0 0 1 -24 -61" stroke="#e8c21a"/>
      <path d="M-4 -66 A66 66 0 0 1 34 -57" stroke="#f08a24"/>
      <path d="M50 -43 A66 66 0 0 1 66 0" stroke="#d8392f"/>
      <path d="M62 22 A66 66 0 0 1 46 47" stroke="#8f3f97"/>
    </g>
    <text y="-6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1f2a36">61</text>
    <text y="22" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#4d5b69">AQI</text>
  </g>

  <!-- the title and the values -->
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="48" y="110" font-size="68" font-weight="bold" fill="#ffffff">Kaiterra</text>
    <text x="52" y="152" font-size="26" fill="#dbe7f5">for Gladys Assistant</text>
    <text x="52" y="196" font-size="19" fill="#c3d4ea">Sensedge · Laser Egg · indoor air</text>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#ffffff">
    <g transform="translate(52 270)">
      <rect width="300" height="46" rx="10" fill="#ffffff" fill-opacity="0.1"/>
      <text x="18" y="31">CO₂</text><text x="282" y="31" text-anchor="end" fill="#f5b041">1 120 ppm</text>
    </g>
    <g transform="translate(52 326)">
      <rect width="300" height="46" rx="10" fill="#ffffff" fill-opacity="0.1"/>
      <text x="18" y="31">PM2.5</text><text x="282" y="31" text-anchor="end" fill="#f5b041">14.2 µg/m³</text>
    </g>
    <g transform="translate(52 382)">
      <rect width="300" height="46" rx="10" fill="#ffffff" fill-opacity="0.1"/>
      <text x="18" y="31">TVOC</text><text x="282" y="31" text-anchor="end" fill="#7ad08f">310 ppb</text>
    </g>
    <g transform="translate(52 438)">
      <rect width="300" height="46" rx="10" fill="#ffffff" fill-opacity="0.1"/>
      <text x="18" y="31">Temperature</text><text x="282" y="31" text-anchor="end">23 °C</text>
    </g>
  </g>
</svg>
